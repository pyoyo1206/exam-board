<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시험 안내 칠판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root {
  /* 배치: 좌우 반반. 왼쪽은 시험 개요, 오른쪽은 아날로그 + 디지털 시계. 단일 테마(칠판). */
  --board: #1f3d31;
  --board-deep: #142a21;
  --chalk: #f5f4ec;
  --chalk-dim: rgba(245, 244, 236, 0.62);
  --chalk-faint: rgba(245, 244, 236, 0.22);
  --yellow: #f6dc7a;
  --coral: #f29a8e;
  --font-display: "Jua", "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  --font-body: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background:
    radial-gradient(ellipse at 30% 20%, rgba(255,255,255,0.06), transparent 55%),
    radial-gradient(ellipse at 80% 90%, rgba(0,0,0,0.25), transparent 60%),
    linear-gradient(160deg, var(--board), var(--board-deep));
  background-color: var(--board);
  color: var(--chalk);
  font-family: var(--font-body);
  overflow: hidden;
  display: grid;
  grid-template-rows: auto 1fr;
}
.top {
  text-align: center;
  padding: 2.6vh 7vw 1.8vh;
  border-bottom: 0.35vw dashed var(--chalk-faint);
}
.board {
  min-height: 0;
  display: grid;
  grid-template-columns: 1fr 1fr;
}

/* ───── 왼쪽: 시험 개요 ───── */
.info {
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 2.6vh;
  padding: 3vh 2.5vw 9vh 7vw;
  border-right: 0.35vw dashed var(--chalk-faint);
  min-width: 0;
}
.exam-name {
  font-family: var(--font-display);
  font-size: clamp(26px, 4.3vw, 110px);
  line-height: 1.15;
  margin: 0;
  font-weight: 400;
  text-wrap: balance;
}
.headline {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  justify-content: space-between;
  gap: 0.5vh 2vw;
}
.classroom {
  font-family: var(--font-display);
  font-size: clamp(22px, 3.4vw, 90px);
  line-height: 1.15;
}
.today {
  font-size: clamp(15px, 2vw, 52px);
  color: var(--chalk-dim);
  font-variant-numeric: tabular-nums;
}
table {
  width: 100%;
  border-collapse: collapse;
  font-size: clamp(16px, 2.2vw, 58px);
}
th {
  font-family: var(--font-display);
  font-weight: 400;
  font-size: 0.62em;
  color: var(--chalk-dim);
  text-align: left;
  padding: 0 0.5em 0.5em;
  border-bottom: 0.2vw solid var(--chalk-faint);
}
td {
  padding: 0.42em 0.5em;
  border-bottom: 0.12vw solid var(--chalk-faint);
  vertical-align: middle;
}
td.period {
  font-family: var(--font-display);
  white-space: nowrap;
  width: 1%;
  padding-right: 1em;
}
td.time { font-variant-numeric: tabular-nums; white-space: nowrap; width: 1%; padding-right: 1em; }
td.subject { font-weight: 700; }
tr.now td { color: var(--yellow); }
tr.now td.period::before { content: "▶ "; font-size: 0.7em; }
tr.done td { color: var(--chalk-dim); }

.extras {
  display: grid;
  grid-template-columns: 1fr 1.4fr;
  gap: 1.6vw;
}
.box {
  border: 0.22vw solid var(--chalk-faint);
  border-radius: 1vw;
  padding: 1.4vh 1.2vw 1.8vh;
  min-width: 0;
}
.box-label {
  font-family: var(--font-display);
  font-size: clamp(13px, 1.55vw, 40px);
  color: var(--chalk-dim);
  margin-bottom: 0.3em;
}
.box-value {
  font-size: clamp(20px, 3.2vw, 84px);
  font-weight: 700;
  line-height: 1.2;
  min-height: 1.2em;
  font-variant-numeric: tabular-nums;
  overflow-wrap: anywhere;
}

[contenteditable] {
  outline: none;
  border-radius: 0.4vw;
  cursor: text;
}
[contenteditable]:focus-visible {
  box-shadow: 0 0 0 0.2vw var(--yellow);
  background: rgba(255,255,255,0.06);
}
[contenteditable]:empty::before {
  content: attr(data-ph);
  color: var(--chalk-faint);
  font-weight: 400;
}

[contenteditable="false"] { cursor: default; }
[contenteditable="false"]:empty::before { content: none; }
.sync {
  position: fixed;
  left: 7vw;
  bottom: 2.2vh;
  font-size: clamp(11px, 1.05vw, 24px);
  color: var(--chalk-dim);
}
button[hidden] { display: none; }

/* ───── 오른쪽: 시계 ───── */
.clock {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1.5vh;
  padding: 3vh 7vw 9vh 2vw;
  min-width: 0;
}
.analog {
  width: min(37vw, 48vh);
  height: min(37vw, 48vh);
}
.analog text {
  fill: var(--chalk);
  font-family: var(--font-display);
  font-size: 13px;
  text-anchor: middle;
  dominant-baseline: central;
}
.digital {
  font-size: min(8.5vw, 14vh);
  font-weight: 700;
  line-height: 1;
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.02em;
  white-space: nowrap;
}
.status {
  font-family: var(--font-display);
  font-size: clamp(16px, 2.4vw, 60px);
  color: var(--yellow);
  min-height: 1.3em;
  text-align: center;
}

/* ───── 도구 ───── */
.tools {
  position: fixed;
  right: 7vw;
  bottom: 1.6vh;
  display: flex;
  gap: 0.6vw;
  opacity: 0.55;
  transition: opacity 0.2s;
}
.tools:hover, .tools:focus-within { opacity: 1; }
button {
  font: inherit;
  font-size: clamp(12px, 1.15vw, 26px);
  color: var(--chalk);
  background: rgba(0,0,0,0.28);
  border: 1px solid var(--chalk-faint);
  border-radius: 0.6vw;
  padding: 0.55em 0.9em;
  cursor: pointer;
}
button:hover { background: rgba(255,255,255,0.12); }
button:focus-visible { outline: 2px solid var(--yellow); outline-offset: 2px; }
.adjust {
  position: fixed;
  right: 7vw;
  bottom: 8vh;
  width: min(92vw, 30em);
  font-size: clamp(13px, 1.25vw, 28px);
  background: var(--board-deep);
  border: 1px solid var(--chalk-faint);
  border-radius: 1vw;
  padding: 1.1em 1.2em 1.2em;
  box-shadow: 0 1vh 4vh rgba(0,0,0,0.5);
}
.adjust[hidden] { display: none; }
.adjust h2 {
  font-family: var(--font-display);
  font-weight: 400;
  font-size: 1.25em;
  margin: 0 0 0.3em;
}
.adjust p { margin: 0 0 0.8em; color: var(--chalk-dim); line-height: 1.5; }
.adjust .offset { color: var(--yellow); font-weight: 700; font-variant-numeric: tabular-nums; }
.adjust .row { display: flex; flex-wrap: wrap; gap: 0.4em; margin-bottom: 0.6em; }
.adjust .row button { font-size: 1em; flex: 1 1 auto; }

@media (max-width: 700px) {
  body { overflow: auto; display: block; }
  .top { padding: 20px 16px 14px; border-bottom-width: 3px; }
  .board { grid-template-columns: 1fr; }
  .info { border-right: 0; border-bottom: 3px dashed var(--chalk-faint); padding: 24px 16px; }
  .clock { padding: 24px 16px 120px; }
  .sync { left: 16px; bottom: 64px; }
  .tools { right: 16px; left: 16px; flex-wrap: wrap; justify-content: flex-end; }
  .analog { width: 70vw; height: 70vw; }
  .digital { font-size: 18vw; }
  .extras { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<header class="top">
  <h1 class="exam-name" contenteditable="true" spellcheck="false" data-key="title" data-ph="고사 이름 입력">2027학년도 1학기 1차 지필평가</h1>
</header>
<main class="board">

  <section class="info" aria-label="시험 개요">
    <div class="headline">
      <div class="classroom" contenteditable="true" spellcheck="false" data-key="class" data-ph="학급 입력">1학년 1반</div>
      <div class="today" id="today"></div>
    </div>

    <table>
      <thead>
        <tr><th>교시</th><th>시간</th><th>과목</th></tr>

          <td class="subject" contenteditable="true" spellcheck="false" data-key="s2" data-ph="과목 입력"></td>

          <td class="subject" contenteditable="true" spellcheck="false" data-key="s3" data-ph="과목 입력"></td>
        </tr>
        <tr>
          <td class="period">4교시</td>
          <td class="time" contenteditable="true" spellcheck="false" data-key="t4" data-ph="00:00~00:00">11:40~12:30</td>
          <td class="subject" contenteditable="true" spellcheck="false" data-key="s4" data-ph="과목 입력"></td>
        </tr>
      </tbody>
    </table>

    <div class="extras">
      <div class="box">
        <div class="box-label">학과코드</div>
        <div class="box-value" contenteditable="true" spellcheck="false" data-key="code" data-ph="입력"></div>

  // ── 저장 / 불러오기 (이 브라우저에만 저장됨) ──
  try {
    var saved = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (saved && typeof saved === 'object') {
      state.fields = saved.fields || {};
      state.offset = Number(saved.offset) || 0;
      if (saved.cache && Array.isArray(saved.cache.rows)) state.cache = saved.cache;
      state.manualDay = saved.manualDay || '';
      state.autoManual = !!saved.autoManual;
      state.dirty = !!saved.dirty;
    }
  } catch (e) {}
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  }
  function has(o, k) { return Object.prototype.hasOwnProperty.call(o, k); }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function now() { return new Date(Date.now() + state.offset * 1000); }
  function dayStr(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function norm(t) { return String(t == null ? '' : t).replace(/\s+/g, ''); }
  function setText(el, t) {
    if (el.textContent === t) return;
    if (t === '') el.innerHTML = ''; else el.textContent = t;
  }

  var els = {}, defaults = {};
  document.querySelectorAll('[contenteditable][data-key]').forEach(function (el) {
    var k = el.dataset.key;
    els[k] = el;
    defaults[k] = el.textContent;
    if (has(state.fields, k)) setText(el, state.fields[k]);
    el.addEventListener('input', function () {
      if (el.textContent.trim() === '') el.innerHTML = '';
      state.fields[k] = el.textContent;
      if (SHEET_KEYS.indexOf(k) >= 0) state.dirty = true;
      save();
      if (k === 'class' && isOnline()) renderSheet();
    });
    el.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); el.blur(); }
    });
    el.addEventListener('paste', function (e) {
      e.preventDefault();
      var text = (e.clipboardData || window.clipboardData).getData('text').replace(/\s+/g, ' ');
      var sel = window.getSelection();
      if (!sel.rangeCount) return;
      var range = sel.getRangeAt(0);
      range.deleteContents();
      range.insertNode(document.createTextNode(text));
      range.collapse(false);
      el.dispatchEvent(new Event('input'));
    });
  });
  function manualValue(k) { return has(state.fields, k) ? state.fields[k] : defaults[k]; }

  // ── 온라인 / 수동 전환 ──
  var modeBtn = document.getElementById('modeBtn');
  var clearBtn = document.getElementById('clearBtn');
  var syncEl = document.getElementById('sync');
  var lastFail = false, noExamToday = false, sheetCodes = [];

  function isOnline() { return !!SHEET_ID && state.manualDay !== dayStr(now()); }

  // 대상(전체 / 1학년 / 1학년 1반 …)이 이 교실에 해당하는 정도: 0이면 해당 없음
  function score(target, cls) {
    var best = 0;
    String(target == null ? '' : target).split(/[,\/]/).forEach(function (raw) {
      var t = norm(raw), s = 0;
      if (t === '' || t === '전체') s = 1;
      else if (t === cls) s = 3;
      else if (cls.indexOf(t) === 0 && !(/\d$/.test(t) && /\d/.test(cls.charAt(t.length)))) s = 2;
      if (s > best) best = s;
    });
    return best;
  }

  function renderSheet() {
    var rows = (state.cache && state.cache.rows) || [];
    var today = dayStr(now());
    var cls = norm(els['class'].textContent);
    var titled = null;
    rows.forEach(function (r) { if (r.title && r.date === today && !titled) titled = r; });
    if (!titled) rows.forEach(function (r) { if (r.title && !titled) titled = r; });
    setText(els.title, titled ? titled.title : manualValue('title'));

    var todays = rows.filter(function (r) { return r.date === today && score(r.target, cls) > 0; });
    noExamToday = !todays.length;
    sheetCodes = [];
    for (var p = 1; p <= 4; p++) {
      var best = null, bs = 0;
      todays.forEach(function (r) {
        if (r.period !== p) return;
        var sc = score(r.target, cls);
        if (sc >= bs) { best = r; bs = sc; }
      });
      var time = '', subj = '';
      if (noExamToday) time = DEFAULT_TIMES[p - 1];
      else if (best) { time = best.time || DEFAULT_TIMES[p - 1]; subj = best.subject; sheetCodes[p] = best.code; }
      setText(els['t' + p], time);
      setText(els['s' + p], subj);
    }
    lastSec = -1;
  }

  function fmtAt(ms) {
    var d = new Date(ms);
    return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }
  function syncText() {
    if (!SHEET_ID) return '';
    if (!isOnline()) return state.autoManual ? '시간표를 불러오지 못해 수동 입력으로 전환했습니다' : '수동 입력 중';
    if (lastFail && state.cache) return '인터넷 연결 안 됨 · 저장된 시간표(' + fmtAt(state.cache.at) + ') 표시 중';
    if (state.cache) return '온라인 시간표 · ' + fmtAt(state.cache.at) + ' 갱신' + (noExamToday ? ' · 오늘 등록된 시험 없음' : '');
    return '시간표 불러오는 중…';
  }

  function applyMode() {
    var online = isOnline();
    SHEET_KEYS.forEach(function (k) {
      els[k].setAttribute('contenteditable', online ? 'false' : 'true');
      if (!online) setText(els[k], manualValue(k));
    });
    if (online) renderSheet();
    modeBtn.hidden = !SHEET_ID;
    modeBtn.textContent = online ? '수동 입력으로 전환' : '온라인 시간표로 전환';
    clearLabel = online ? '결시번호 지우기' : '과목·결시 지우기';
    if (!clearTimer) clearBtn.textContent = clearLabel;
    syncEl.textContent = syncText();
    lastSec = -1;
  }

  modeBtn.addEventListener('click', function () {
    if (isOnline()) {
      SHEET_KEYS.forEach(function (k) { state.fields[k] = els[k].textContent; });
      state.manualDay = dayStr(now());
    } else {
      state.manualDay = '';
    }
    state.autoManual = false; state.dirty = false;
    save(); applyMode();
    if (isOnline()) fetchSheet();
  });

  // ── 구글 시트 불러오기 ──
  function cellText(c) {
    if (!c) return '';
    if (c.f != null) return String(c.f).trim();
    return c.v == null ? '' : String(c.v).trim();
  }
  function cellDate(c) {
    if (!c) return '';
    var m = typeof c.v === 'string' && /^Date\((\d+),(\d+),(\d+)/.exec(c.v);
    if (m) return m[1] + '-' + pad(+m[2] + 1) + '-' + pad(+m[3]);
    var nums = cellText(c).match(/\d+/g);
    if (!nums) return '';
    if (nums.length >= 3) {
      var y = +nums[0]; if (y < 100) y += 2000;
      return y + '-' + pad(+nums[1]) + '-' + pad(+nums[2]);
    }
    if (nums.length === 2) return now().getFullYear() + '-' + pad(+nums[0]) + '-' + pad(+nums[1]);
    return '';
  }
  function parseTable(table) {
    var labels = (table.cols || []).map(function (c) { return norm(c.label); });
    var data = table.rows || [];
    if (!labels.some(function (l) { return l; }) && data.length) {
      labels = (data[0].c || []).map(function (c) { return norm(cellText(c)); });
      data = data.slice(1);
    }
    function col(word) {
      for (var i = 0; i < labels.length; i++) if (labels[i].indexOf(word) >= 0) return i;
      return -1;
    }
    var ix = { date: col('날짜'), target: col('대상'), period: col('교시'), time: col('시간'),
               subject: col('과목'), code: col('코드'), title: col('고사') };
    var out = [];
    data.forEach(function (r) {
      var c = r.c || [];
      function get(i) { return i >= 0 ? cellText(c[i]) : ''; }
      var date = ix.date >= 0 ? cellDate(c[ix.date]) : '';
      var title = get(ix.title);
      var period = parseInt((get(ix.period).match(/\d+/) || [''])[0], 10) || 0;
      if (!date && !title) return;
      out.push({ date: date, target: get(ix.target), period: period, time: get(ix.time),
                 subject: get(ix.subject), code: get(ix.code), title: title });
    });
    return out;
  }

  var fetching = false;
  function fetchSheet() {
    if (!SHEET_ID || fetching) return;
    fetching = true;
    var cb = '__examSheet' + Date.now();
    var script = document.createElement('script');
    var finished = false;
    function finish(ok, res) {
      if (finished) return;
      finished = true; fetching = false;
      clearTimeout(timer);
      try { delete window[cb]; } catch (e) { window[cb] = undefined; }
      if (script.parentNode) script.parentNode.removeChild(script);
      var rows = null;
      if (ok && res && res.status !== 'error' && res.table) {
        try { rows = parseTable(res.table); } catch (e) { rows = null; }
      }
      var today = dayStr(now());
      if (rows) {
        lastFail = false;
        state.cache = { rows: rows, at: Date.now() };
        if (state.autoManual && !state.dirty && state.manualDay === today) {
          state.manualDay = ''; state.autoManual = false;
        }
      } else {
        lastFail = true;
        if (!state.cache && isOnline()) {
          state.manualDay = today; state.autoManual = true; state.dirty = false;
        }
      }
      save(); applyMode();
    }
    var timer = setTimeout(function () { finish(false); }, 10000);
    window[cb] = function (res) { finish(true, res); };
    script.onerror = function () { finish(false); };
    script.src = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID +
      '/gviz/tq?tqx=out:json;responseHandler:' + cb + '&headers=1&_=' + Date.now();
    document.head.appendChild(script);
  }

  // ── 시계 눈금 ──
  var NS = 'http://www.w3.org/2000/svg';
  var ticks = document.getElementById('ticks');
  for (var i = 0; i < 60; i++) {
    var big = i % 5 === 0;
    var line = document.createElementNS(NS, 'line');
    line.setAttribute('x1', 0); line.setAttribute('x2', 0);
    line.setAttribute('y1', -92);
    line.setAttribute('y2', big ? -85 : -89);
    line.setAttribute('stroke', '#f5f4ec');
    line.setAttribute('stroke-width', big ? 2 : 0.8);
    line.setAttribute('opacity', big ? 1 : 0.6);
    line.setAttribute('transform', 'rotate(' + i * 6 + ')');
    ticks.appendChild(line);
  }
  for (var h = 1; h <= 12; h++) {
    var a = h * 30 * Math.PI / 180;
    var t = document.createElementNS(NS, 'text');
    t.setAttribute('x', (Math.sin(a) * 73).toFixed(2));
    t.setAttribute('y', (-Math.cos(a) * 73).toFixed(2));
    t.textContent = h;
    ticks.appendChild(t);
  }

  // ── 시간 계산 ──
  var hourHand = document.getElementById('hourHand');
  var minHand = document.getElementById('minHand');
  var secHand = document.getElementById('secHand');
  var hmEl = document.getElementById('hm');
  var todayEl = document.getElementById('today');
  var statusEl = document.getElementById('status');
  var rows = Array.prototype.slice.call(document.querySelectorAll('#rows tr'));
  var DAYS = ['일', '월', '화', '수', '목', '금', '토'];

  // "08:40~09:30" 같은 글자에서 시작·끝 시각(초)을 읽는다
  function parseRange(text) {
    var re = /(\d{1,2})\s*[:：;]\s*(\d{2})/g, m, out = [];
    while ((m = re.exec(text)) && out.length < 2) {
      var hh = +m[1], mm = +m[2];
      if (hh < 24 && mm < 60) out.push(hh * 3600 + mm * 60);
    }
    return out.length === 2 && out[1] > out[0] ? { start: out[0], end: out[1] } : null;
  }
  function remainText(sec) {
    if (sec < 60) return sec + '초';
    var min = Math.ceil(sec / 60);
    if (min < 60) return min + '분';
    return Math.floor(min / 60) + '시간' + (min % 60 ? ' ' + (min % 60) + '분' : '');
  }

  function updateStatus(s) {
    var periods = [];
    rows.forEach(function (tr, idx) {
      var r = parseRange(tr.querySelector('.time').textContent);
      tr.classList.remove('now', 'done');
      if (r) { r.n = idx + 1; r.tr = tr; periods.push(r); }
    });
    var msg = '', current = null, next = null, anyDone = false;
    periods.forEach(function (p) {
      if (s >= p.end) { p.tr.classList.add('done'); anyDone = true; }
      else if (s >= p.start) current = p;
      else if (!next) next = p;
    });
    if (current) {
      current.tr.classList.add('now');
      msg = current.n + '교시 시험 중 · 종료까지 ' + remainText(current.end - s);
    } else if (next) {
      msg = (anyDone ? '쉬는 시간 · ' : '') + next.n + '교시 시작까지 ' + remainText(next.start - s);
    } else if (periods.length) {
      msg = '오늘 시험이 모두 끝났습니다';
    }
    if (isOnline() && noExamToday) msg = '';
    if (statusEl.textContent !== msg) statusEl.textContent = msg;

    // 온라인일 때 학과코드는 지금(또는 다음) 교시의 값을 보여 준다
    if (isOnline()) {
      var n = current ? current.n : next ? next.n : 0;
      var code = (n && sheetCodes[n]) || '';
      if (!code) for (var k = 1; k <= 4 && !code; k++) code = sheetCodes[k] || '';
      setText(els.code, code);
    }
  }

  var lastSec = -1, lastDay = '';
  function tick() {
    var d = now();
    var sec = d.getSeconds();
    if (sec === lastSec) return;
    lastSec = sec;
    var h = d.getHours(), m = d.getMinutes();
    hmEl.textContent = pad(h) + ':' + pad(m);
    var dateText = d.getFullYear() + '년 ' + (d.getMonth() + 1) + '월 ' + d.getDate() + '일 (' + DAYS[d.getDay()] + ')';
    if (todayEl.textContent !== dateText) todayEl.textContent = dateText;
    var day = dayStr(d);
    if (lastDay && lastDay !== day) { lastDay = day; applyMode(); }
    lastDay = day;
    updateStatus(h * 3600 + m * 60 + sec);
  }
  // 바늘은 매 프레임 부드럽게 움직인다
  function hands() {
    var d = now();
    var s = d.getSeconds() + d.getMilliseconds() / 1000;
    var m = d.getMinutes() + s / 60;
    var h = (d.getHours() % 12) + m / 60;
    secHand.setAttribute('transform', 'rotate(' + (s * 6).toFixed(2) + ')');
    minHand.setAttribute('transform', 'rotate(' + (m * 6).toFixed(2) + ')');
    hourHand.setAttribute('transform', 'rotate(' + (h * 30).toFixed(2) + ')');
    requestAnimationFrame(hands);
  }

  // ── 시계 맞추기 ──
  var adjust = document.getElementById('adjust');
  var offsetText = document.getElementById('offsetText');
  function showOffset() {
    var o = state.offset, sign = o > 0 ? '+' : o < 0 ? '−' : '';
    var abs = Math.abs(o), mm = Math.floor(abs / 60), ss = abs % 60;
    offsetText.textContent = sign + (mm ? mm + '분 ' : '') + ss + '초';
  }
  showOffset();
  document.getElementById('adjustBtn').addEventListener('click', function () {
    adjust.hidden = !adjust.hidden;
  });
  document.getElementById('closeAdjust').addEventListener('click', function () { adjust.hidden = true; });
  adjust.querySelectorAll('[data-adj]').forEach(function (b) {
    b.addEventListener('click', function () {
      state.offset += Number(b.dataset.adj);
      save(); showOffset(); applyMode(); tick();
    });
  });
  document.getElementById('resetOffset').addEventListener('click', function () {
    state.offset = 0; save(); showOffset(); applyMode(); tick();
  });

  // ── 지우기 (두 번 눌러야 지워짐) ──
  var clearLabel = clearBtn.textContent, clearTimer = null;
  clearBtn.addEventListener('click', function () {
    if (!clearTimer) {
      clearBtn.textContent = '한 번 더 누르면 지워집니다';
      clearTimer = setTimeout(function () { clearBtn.textContent = clearLabel; clearTimer = null; }, 3000);
      return;
    }
    clearTimeout(clearTimer); clearTimer = null;
    clearBtn.textContent = clearLabel;
    var keys = isOnline() ? ['absent'] : ['s1', 's2', 's3', 's4', 'code', 'absent'];
    keys.forEach(function (k) {
      els[k].innerHTML = '';
      state.fields[k] = '';
    });
    save();
  });

  // ── 전체 화면 + 화면 꺼짐 방지 ──
  var fullBtn = document.getElementById('fullBtn');
  fullBtn.addEventListener('click', function () {
    try {
      if (document.fullscreenElement) document.exitFullscreen();
      else {
        var p = document.documentElement.requestFullscreen();
        if (p && p.catch) p.catch(function () {});
      }
    } catch (e) {}
  });
  document.addEventListener('fullscreenchange', function () {
    fullBtn.textContent = document.fullscreenElement ? '전체 화면 끄기' : '전체 화면';
  });

  var wake = null;
  function keepAwake() {
    try {
      if (!('wakeLock' in navigator) || wake) return;
      navigator.wakeLock.request('screen').then(function (w) {
        wake = w;
        w.addEventListener('release', function () { wake = null; });
      }).catch(function () {});
    } catch (e) {}
  }
  document.addEventListener('click', keepAwake);
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') keepAwake();
  });

  // ── 시작 ──
  applyMode();
  hands();
  tick();
  setInterval(tick, 100);
  fetchSheet();
  setInterval(fetchSheet, REFRESH_MIN * 60000);
  window.addEventListener('online', fetchSheet);
})();
</script>
</body>
</html>
